name: CI

on:
  push: {}
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"
      - name: Install deps
        run: |
          pip install -r requirements.txt || true
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: Run smoke test
        run: python3 tests/smoke_test.py
