<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Impact Church Finance Dashboard</title>
    <link rel="stylesheet" href="styles/dashboard.css" />
    <!-- Chart.js for visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <div class="dashboard-container">
      <!-- Header -->
      <header class="dashboard-header">
        <h1>Impact Church Financial Dashboard</h1>
        <div class="header-info">
          <div class="report-period">
            Report Week: <span id="reportWeek"></span>
          </div>
          <div class="last-updated">
            Last Updated: <span id="lastUpdate"></span>
          </div>
        </div>
      </header>

      <!-- KPI Cards -->
      <section class="kpi-section">
        <div class="kpi-card">
          <h3>WTD Contributions</h3>
          <div class="kpi-value" id="wtdContributions">$0</div>
          <div class="kpi-variance" id="wtdVariance"></div>
        </div>
        <div class="kpi-card">
          <h3>MTD Contributions</h3>
          <div class="kpi-value" id="mtdContributions">$0</div>
          <div class="kpi-variance" id="mtdVariance"></div>
        </div>
        <div class="kpi-card">
          <h3>YTD Contributions</h3>
          <div class="kpi-value" id="ytdContributions">$0</div>
          <div class="kpi-variance" id="ytdVariance"></div>
        </div>
        <div class="kpi-card">
          <h3>Distinct Givers</h3>
          <div class="kpi-value" id="distinctGivers">0</div>
          <div class="kpi-change" id="giversChange"></div>
        </div>
      </section>

      <!-- Charts Row 1 -->
      <section class="charts-row">
        <div class="chart-container">
          <h3>Weekly Contributions Trend</h3>
          <canvas id="weeklyTrendChart"></canvas>
        </div>
        <div class="chart-container">
          <h3>Giving Method Distribution</h3>
          <canvas id="givingMethodChart"></canvas>
        </div>
      </section>

      <!-- Charts Row 2 -->
      <section class="charts-row">
        <div class="chart-container">
          <h3>Budget vs Actual</h3>
          <canvas id="budgetChart"></canvas>
        </div>
        <div class="chart-container">
          <h3>YoY Comparison</h3>
          <canvas id="yoyChart"></canvas>
        </div>
      </section>

      <!-- Data Table -->
      <section class="data-table-section">
        <h3>Recent Large Gifts</h3>
        <table id="largeGiftsTable">
          <thead>
            <tr>
              <th>Date</th>
              <th>Amount</th>
              <th>Method</th>
              <th>Category</th>
            </tr>
          </thead>
          <tbody id="largeGiftsBody">
            <!-- Populated by JavaScript -->
          </tbody>
        </table>
      </section>
    </div>

    <script src="scripts/data-loader.js"></script>
    <script src="scripts/charts.js"></script>
    <script src="scripts/main.js"></script>
  </body>
</html>
